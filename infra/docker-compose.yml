name: tildes

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tildes}
      POSTGRES_USER: ${POSTGRES_USER:-tildes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tildes}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tildes} -d ${POSTGRES_DB:-tildes}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tildes}
      POSTGRES_USER: ${POSTGRES_USER:-tildes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tildes}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,core
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://core:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - core

volumes:
  pgdata:
  frontend_node_modules: